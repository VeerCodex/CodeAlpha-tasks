<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Meet | CollabAlpha Studio — CodeAlpha Task 4</title>
  <meta name="description" content="CodeAlpha Full Stack Internship Task 4: Real-Time Communication App featuring Google Meet UI, video conferencing, collaborative Jamboard whiteboard, and file sharing.">
  <meta name="author" content="Veernarayan">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/whiteboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- 1. TOP HEADER (Google Meet Minimalist Bar) -->
  <header class="studio-top-bar">
    <div class="room-meta-group">
      <div class="brand-icon-studio" title="CollabAlpha Meeting">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
      </div>
      <div>
        <div class="room-title-text" id="roomTitleDisplay">Sprint Standup & Architecture Planning</div>
        <div style="display:flex; align-items:center; gap:0.5rem; margin-top:0.15rem;">
          <span class="room-code-tag" id="btnCopyRoomCode" title="Click to copy Room Code">
            <span id="roomCodeDisplay">ALPHA-9428-TECH</span> 📋
          </span>
          <span class="encryption-pill">🔒 End-to-end Encrypted</span>
        </div>
      </div>
    </div>

    <!-- View Mode Switcher Pills -->
    <div class="view-mode-tabs">
      <button class="view-tab-btn active" data-view="video">📹 Video Tiles</button>
      <button class="view-tab-btn" data-view="whiteboard">🎨 Whiteboard Jamboard</button>
    </div>
  </header>

  <!-- 2. COLLABORATION STAGE -->
  <main class="collaboration-stage">

    <!-- Video Grid View (Google Meet Dynamic Grid) -->
    <section class="video-grid-stage" id="videoGridStage">
      
      <!-- Local User Video Tile -->
      <div class="video-card local-user" id="localVideoCard">
        <div class="tile-more-btn" title="More options">⋮</div>
        <video id="localVideoElement" autoplay playsinline muted></video>
        <div class="video-avatar-placeholder" id="localAvatarFallback" style="display: none;">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80" alt="Local User" class="video-avatar-img">
          <p style="font-size: 0.95rem; font-weight: 500; color: #ffffff;">Veernarayan (You)</p>
        </div>
        <div class="video-card-overlay">
          <div class="participant-name-badge">
            <span>Veernarayan (You)</span>
            <span class="mic-status-icon" id="localMicStatus">🎙️</span>
          </div>
        </div>
      </div>

      <!-- Peer 1: Aarav Sharma (Speaking Active Tile) -->
      <div class="video-card speaking">
        <div class="tile-more-btn" title="More options">⋮</div>
        <div class="video-avatar-placeholder">
          <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=200&q=80" alt="Aarav" class="video-avatar-img">
          <p style="font-size: 0.95rem; font-weight: 500; color: #ffffff;">Aarav Sharma</p>
        </div>
        <div class="video-card-overlay">
          <div class="participant-name-badge">
            <span>Aarav Sharma</span>
            <span class="mic-status-icon" style="color: #8ab4f8;">🔊</span>
          </div>
        </div>
      </div>

      <!-- Peer 2: Sneha Patel -->
      <div class="video-card">
        <div class="tile-more-btn" title="More options">⋮</div>
        <div class="video-avatar-placeholder">
          <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=200&q=80" alt="Sneha" class="video-avatar-img">
          <p style="font-size: 0.95rem; font-weight: 500; color: #ffffff;">Sneha Patel</p>
        </div>
        <div class="video-card-overlay">
          <div class="participant-name-badge">
            <span>Sneha Patel</span>
            <span class="mic-status-icon">🎙️</span>
          </div>
        </div>
      </div>

      <!-- Peer 3: Rohan Verma -->
      <div class="video-card">
        <div class="tile-more-btn" title="More options">⋮</div>
        <div class="video-avatar-placeholder">
          <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=200&q=80" alt="Rohan" class="video-avatar-img">
          <p style="font-size: 0.95rem; font-weight: 500; color: #ffffff;">Rohan Verma</p>
        </div>
        <div class="video-card-overlay">
          <div class="participant-name-badge">
            <span>Rohan Verma</span>
            <span class="mic-status-icon">🔇</span>
          </div>
        </div>
      </div>

    </section>

    <!-- Screen Share Stage -->
    <section class="screen-share-view" id="screenShareStage">
      <video id="screenShareVideo" class="screen-share-video" autoplay playsinline></video>
    </section>

    <!-- Collaborative Whiteboard Stage (Google Jamboard Style) -->
    <section class="whiteboard-stage" id="whiteboardStage">
      <!-- Floating Whiteboard Toolbar -->
      <div class="whiteboard-toolbar">
        <div class="color-swatches-group">
          <div class="color-swatch active" style="background:#1a73e8;" data-color="#1a73e8" title="Google Blue"></div>
          <div class="color-swatch" style="background:#ea4335;" data-color="#ea4335" title="Google Red"></div>
          <div class="color-swatch" style="background:#34a853;" data-color="#34a853" title="Google Green"></div>
          <div class="color-swatch" style="background:#fbbc04;" data-color="#fbbc04" title="Google Yellow"></div>
          <div class="color-swatch" style="background:#202124;" data-color="#202124" title="Dark Slate"></div>
          <div class="color-swatch" style="background:#9c27b0;" data-color="#9c27b0" title="Purple"></div>
        </div>

        <div class="brush-sizes-group">
          <button class="brush-size-btn" data-size="2">Fine</button>
          <button class="brush-size-btn active" data-size="4">Medium</button>
          <button class="brush-size-btn" data-size="10">Marker</button>
        </div>

        <button class="wb-action-btn" id="btnEraser" title="Eraser Tool">🧹 Eraser</button>
        <button class="wb-action-btn" id="btnClearWhiteboard" title="Clear Canvas">🗑️ Clear Frame</button>
        <button class="wb-action-btn" id="btnDownloadDrawing" style="background:#1a73e8; color:#ffffff; border-color:transparent;" title="Save as PNG">💾 Export PNG</button>
      </div>

      <!-- High-Precision Pointer Canvas (Trackpad, Mouse & Touch Supported) -->
      <div class="whiteboard-canvas-wrap">
        <canvas id="whiteboardCanvas"></canvas>
      </div>
    </section>

    <!-- Google Meet In-Call Chat Drawer -->
    <aside class="studio-side-drawer" id="chatDrawer">
      <div class="drawer-header">
        <span>In-call messages</span>
        <button class="btn-close-drawer" onclick="meeting.toggleDrawer('chat')" title="Close Chat">✕</button>
      </div>
      <div class="drawer-body" id="meetingChatList"></div>
      <div class="chat-input-row">
        <input type="text" id="chatInputMessage" class="chat-input-field" placeholder="Send a message to everyone...">
        <button class="action-icon-btn active" style="width:2.2rem; height:2.2rem;" onclick="meeting.handleSendChat()" title="Send">
          ➤
        </button>
      </div>
    </aside>

    <!-- Google Meet People & Documents Drawer -->
    <aside class="studio-side-drawer" id="filesDrawer">
      <div class="drawer-header">
        <span>Meeting Attachments</span>
        <button class="btn-close-drawer" onclick="meeting.toggleDrawer('files')" title="Close">✕</button>
      </div>
      <div class="drawer-body" id="meetingFilesList"></div>
      <div style="padding: 1rem; border-top: 1px solid var(--meet-border-subtle);">
        <button class="wb-action-btn" style="width:100%; justify-content:center; padding:0.6rem; background:var(--meet-blue); color:#fff; border:none;" onclick="meeting.handleUploadDemoFile()">
          + Add Attachment
        </button>
      </div>
    </aside>

  </main>

  <!-- 3. GOOGLE MEET BOTTOM CONTROLS DOCK -->
  <footer class="bottom-dock-bar">
    
    <!-- Left Section: Clock & Meeting Code -->
    <div class="dock-left-meta">
      <span class="dock-meeting-time" id="dockClock">01:55 AM</span>
      <span class="dock-divider-pipe">|</span>
      <span class="dock-room-code" id="btnCopyMeetingCode" onclick="navigator.clipboard.writeText('ALPHA-9428-TECH'); window.showToast('Room code copied!', 'success');" title="Click to copy room code">alpha-9428-tech</span>
    </div>

    <!-- Center Section: Circular Media Controls -->
    <div class="dock-center-controls">
      <button class="media-control-btn" id="btnToggleMic" title="Turn off microphone (ctrl + d)">
        🎙️
      </button>
      <button class="media-control-btn" id="btnToggleCam" title="Turn off camera (ctrl + e)">
        📹
      </button>
      <button class="media-control-btn" id="btnRaiseHand" title="Raise hand">
        ✋
      </button>
      <button class="media-control-btn" id="btnToggleScreen" title="Present now / Share screen">
        ⬆️
      </button>
      <button class="media-control-btn" id="btnToggleWhiteboard" title="Open Whiteboard Jamboard">
        🎨
      </button>
      <button class="btn-end-meeting" id="btnEndCall" title="Leave call">
        📞 <span>Leave</span>
      </button>
    </div>

    <!-- Right Section: Details, People, Chat, Activities -->
    <div class="dock-right-actions">
      <button class="action-icon-btn" id="btnMeetingInfo" title="Meeting details">
        ℹ️
      </button>
      <button class="action-icon-btn" id="btnTogglePeople" onclick="meeting.toggleDrawer('files')" title="People and Attachments">
        👥 <span class="badge-count">4</span>
      </button>
      <button class="action-icon-btn" id="btnToggleChat" title="Chat with everyone">
        💬
      </button>
      <button class="action-icon-btn" id="btnToggleActivities" onclick="document.querySelector('[data-view=\'whiteboard\']').click()" title="Activities / Whiteboard">
        ▲◼●
      </button>
    </div>

  </footer>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/webrtc.js"></script>
  <script src="js/whiteboard.js"></script>
  <script src="js/meeting.js"></script>
</body>
</html>
