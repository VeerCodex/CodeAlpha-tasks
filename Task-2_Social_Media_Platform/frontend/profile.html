<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — PulseAlpha | CodeAlpha Task 2</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <div class="layout-container">

    <!-- LEFT SIDEBAR -->
    <aside class="sidebar-left">
      <div>
        <a href="index.html" class="brand-logo-social">
          <div class="brand-icon">
            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
          <div class="brand-name-text">Pulse<span>Alpha</span></div>
        </a>

        <nav class="nav-links-menu">
          <a href="index.html" class="nav-menu-item">
            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
            </svg>
            <span>Home Feed</span>
          </a>
          <a href="profile.html" class="nav-menu-item active">
            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            <span>My Profile</span>
          </a>
          <a href="auth.html" class="nav-menu-item">
            <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
            </svg>
            <span>Switch Account</span>
          </a>
        </nav>
      </div>

      <div class="user-mini-card" id="userMiniCard"></div>
    </aside>

    <!-- CENTER PROFILE CONTENT -->
    <main class="main-feed-column">

      <div style="margin-bottom: 1rem;">
        <a href="index.html" style="display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-muted); font-size: 0.9rem; font-weight: 600;">
          ← Back to News Feed
        </a>
      </div>

      <!-- Profile Cover Banner & Details Card -->
      <section class="profile-cover-card" id="profileHeaderCard">
        <img id="profileBannerImg" src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1200&q=80" alt="Banner" class="profile-banner-img">
        
        <div class="profile-info-block">
          <div class="profile-avatar-row">
            <img id="profileAvatarImg" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Avatar" class="profile-avatar-huge">
            <div id="profileActionBtnContainer">
              <!-- Follow button or Edit Profile -->
            </div>
          </div>

          <h1 class="profile-fullname" id="profileName">Loading Profile...</h1>
          <div class="profile-handle-sub" id="profileHandle">@loading</div>
          <p class="profile-bio-text" id="profileBio">Bio information...</p>

          <div class="profile-meta-row">
            <span id="profileLocation">📍 Bengaluru, India</span>
            <span id="profileWebsite">🔗 <a href="#" target="_blank">Website</a></span>
            <span id="profileJoined">📅 Joined September 2026</span>
          </div>

          <div class="profile-stats-bar">
            <div class="stat-metric"><strong id="statPostsCount">0</strong> Posts</div>
            <div class="stat-metric"><strong id="statFollowersCount">0</strong> Followers</div>
            <div class="stat-metric"><strong id="statFollowingCount">0</strong> Following</div>
          </div>
        </div>
      </section>

      <!-- Profile Posts Section -->
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem;">Published Posts</h2>
      <div id="userPostsStream">
        <!-- Injected user posts -->
      </div>

    </main>

    <!-- RIGHT SIDEBAR -->
    <aside class="sidebar-right">
      <div class="widget-card">
        <h3 class="widget-title"><span>👥</span> Suggested Creators</h3>
        <div id="whoToFollowList"></div>
      </div>
      <div class="widget-card">
        <h3 class="widget-title"><span>📈</span> Trending Topics</h3>
        <div id="trendingTagsList"></div>
      </div>
    </aside>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    let currentProfileUserId = null;

    async function loadUserProfile() {
      const urlParams = new URLSearchParams(window.location.search);
      const currentUser = auth.getUser();
      const profileId = urlParams.get('id') || (currentUser ? currentUser.id : 'usr-demo');
      currentProfileUserId = profileId;

      try {
        const res = await api.getUser(profileId);
        if (res.success && res.user) {
          const u = res.user;
          document.getElementById('profileName').textContent = u.name;
          document.getElementById('profileHandle').textContent = `@${u.handle}`;
          document.getElementById('profileBio').textContent = u.bio || 'Tech builder & creative thinker.';
          document.getElementById('profileAvatarImg').src = u.avatar;
          if (u.banner) document.getElementById('profileBannerImg').src = u.banner;
          if (u.location) document.getElementById('profileLocation').textContent = `📍 ${u.location}`;
          if (u.website) {
            document.getElementById('profileWebsite').innerHTML = `🔗 <a href="${u.website}" target="_blank" style="color:var(--accent-primary);">${u.website.replace('https://', '')}</a>`;
          }
          if (u.joinedDate) document.getElementById('profileJoined').textContent = `📅 Joined ${u.joinedDate}`;

          document.getElementById('statPostsCount').textContent = u.postsCount;
          document.getElementById('statFollowersCount').textContent = u.followersCount;
          document.getElementById('statFollowingCount').textContent = u.followingCount;

          // Action button
          const actionContainer = document.getElementById('profileActionBtnContainer');
          const isSelf = currentUser && currentUser.id === u.id;

          if (isSelf) {
            actionContainer.innerHTML = `
              <button class="btn-follow-toggle" onclick="window.showToast('Profile editing enabled in settings', 'info')">
                Edit Profile
              </button>
            `;
          } else {
            const followText = u.isFollowing ? 'Following' : '+ Follow';
            const followClass = u.isFollowing ? 'following' : '';
            actionContainer.innerHTML = `
              <button class="btn-follow-toggle ${followClass}" id="profileFollowBtn" onclick="toggleProfileFollow('${u.id}')">
                ${followText}
              </button>
            `;
          }
        }

        // Load Posts by this user
        loadUserPostsOnly(profileId);

      } catch (err) {
        console.error('Failed to load profile', err);
      }
    }

    async function toggleProfileFollow(targetId) {
      const btn = document.getElementById('profileFollowBtn');
      try {
        const res = await api.toggleFollow(targetId);
        if (res.success) {
          if (res.isFollowing) {
            btn.textContent = 'Following';
            btn.classList.add('following');
            window.showToast('Following user!', 'success');
          } else {
            btn.textContent = '+ Follow';
            btn.classList.remove('following');
            window.showToast('Unfollowed', 'info');
          }
          document.getElementById('statFollowersCount').textContent = res.targetFollowersCount;
        }
      } catch (err) {
        window.showToast('Failed to update follow', 'error');
      }
    }

    async function loadUserPostsOnly(userId) {
      const stream = document.getElementById('userPostsStream');
      try {
        const res = await api.getFeed('all');
        if (res.success) {
          const userPosts = res.posts.filter(p => p.author.id === userId);
          if (userPosts.length === 0) {
            stream.innerHTML = `<p style="color:var(--text-muted); padding: 2rem 0;">No posts shared yet by this user.</p>`;
            return;
          }
          stream.innerHTML = userPosts.map(p => app.renderPostCard(p)).join('');
        }
      } catch (err) {
        stream.innerHTML = `<p style="color:var(--accent-rose);">Failed to load user posts.</p>`;
      }
    }

    document.addEventListener('DOMContentLoaded', loadUserProfile);
  </script>
</body>
</html>
