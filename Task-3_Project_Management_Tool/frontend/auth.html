<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In / Register — TaskAlpha | CodeAlpha Task 3</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/kanban.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-center-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
    }
    .auth-card-box {
      background: #121826;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      padding: 2.25rem;
      box-shadow: var(--shadow-lg);
    }
    .auth-tab-buttons {
      display: flex;
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      padding: 0.35rem;
      margin-bottom: 2rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border-radius: var(--radius-sm);
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent-primary);
      color: white;
    }
    .auth-group {
      margin-bottom: 1.25rem;
    }
    .auth-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      margin-bottom: 0.4rem;
    }
    .auth-input-field {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-size: 0.92rem;
    }
    .auth-input-field:focus {
      border-color: var(--accent-primary);
    }
    .btn-auth-action {
      width: 100%;
      margin-top: 1rem;
      padding: 0.85rem;
      font-size: 0.95rem;
      justify-content: center;
    }
  </style>
</head>
<body>

  <div class="auth-center-wrap">
    <div class="auth-card-box">
      
      <div style="text-align: center; margin-bottom: 1.5rem;">
        <div class="brand-logo-kanban" style="justify-content: center; margin-bottom: 0.5rem;">
          <div class="brand-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path>
            </svg>
          </div>
          <span>TaskAlpha</span>
        </div>
        <p style="color: var(--text-muted); font-size: 0.85rem;">CodeAlpha Task 3: Project Management Tool</p>
      </div>

      <div class="auth-tab-buttons">
        <button class="tab-btn active" id="tabLogin" onclick="switchTab('login')">Sign In</button>
        <button class="tab-btn" id="tabRegister" onclick="switchTab('register')">Create Account</button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="auth-group">
          <label>Email Address</label>
          <input type="email" id="loginEmail" class="auth-input-field" placeholder="demo@codealpha.com" required>
        </div>
        <div class="auth-group">
          <label>Password</label>
          <input type="password" id="loginPassword" class="auth-input-field" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-new-task-nav btn-auth-action" id="btnLogin">
          Access Workspace
        </button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display: none;" onsubmit="handleRegister(event)">
        <div class="auth-group">
          <label>Full Name</label>
          <input type="text" id="regName" class="auth-input-field" placeholder="e.g. Veernarayan" required>
        </div>
        <div class="auth-group">
          <label>Role / Designation</label>
          <input type="text" id="regRole" class="auth-input-field" placeholder="e.g. Lead Full Stack Architect" required>
        </div>
        <div class="auth-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" class="auth-input-field" placeholder="you@example.com" required>
        </div>
        <div class="auth-group">
          <label>Password (min 6 characters)</label>
          <input type="password" id="regPassword" class="auth-input-field" placeholder="••••••••" minlength="6" required>
        </div>
        <button type="submit" class="btn-new-task-nav btn-auth-action" id="btnRegister">
          Create Account
        </button>
      </form>

      <!-- Auto-fill Demo Box -->
      <div style="margin-top: 2rem; padding-top: 1.25rem; border-top: 1px solid var(--border-subtle); text-align: center;">
        <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.6rem;">Testing as CodeAlpha Evaluator?</p>
        <button type="button" class="btn-new-task-nav" style="background: rgba(255,255,255,0.08); font-size: 0.82rem; padding: 0.45rem 1rem;" onclick="fillDemo()">
          ⚡ Auto-Fill Demo Credentials
        </button>
      </div>

    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    function switchTab(t) {
      const loginForm = document.getElementById('loginForm');
      const regForm = document.getElementById('registerForm');
      const tabLogin = document.getElementById('tabLogin');
      const tabReg = document.getElementById('tabRegister');

      if (t === 'login') {
        loginForm.style.display = 'block';
        regForm.style.display = 'none';
        tabLogin.classList.add('active');
        tabReg.classList.remove('active');
      } else {
        loginForm.style.display = 'none';
        regForm.style.display = 'block';
        tabLogin.classList.remove('active');
        tabReg.classList.add('active');
      }
    }

    function fillDemo() {
      switchTab('login');
      document.getElementById('loginEmail').value = 'demo@codealpha.com';
      document.getElementById('loginPassword').value = 'password123';
      window.showToast('Demo credentials filled', 'info');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('btnLogin');

      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      try {
        const res = await api.login(email, password);
        if (res.success && res.token) {
          auth.setSession(res.token, res.user);
          window.showToast(`Welcome back, ${res.user.name}!`, 'success');
          setTimeout(() => window.location.href = 'index.html', 700);
        } else {
          window.showToast(res.message || 'Login failed', 'error');
          btn.disabled = false;
          btn.textContent = 'Access Workspace';
        }
      } catch (err) {
        window.showToast('Server connection error', 'error');
        btn.disabled = false;
        btn.textContent = 'Access Workspace';
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const role = document.getElementById('regRole').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('btnRegister');

      btn.disabled = true;
      btn.textContent = 'Creating...';

      try {
        const res = await api.register({ name, role, email, password });
        if (res.success && res.token) {
          auth.setSession(res.token, res.user);
          window.showToast('Account created successfully!', 'success');
          setTimeout(() => window.location.href = 'index.html', 700);
        } else {
          window.showToast(res.message || 'Registration failed', 'error');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      } catch (err) {
        window.showToast('Server connection error', 'error');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
